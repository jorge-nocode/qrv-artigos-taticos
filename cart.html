<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="description" content="Revise os itens do seu carrinho de compras na QRV Artigos Táticos antes de finalizar o pedido.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/favicon-192.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Carrinho | QRV Artigos Táticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=25">
</head>
<body>

<div id="site-header"></div>

  <section class="page-header"><div class="container"></div></section>

  <section class="section tight">
    <div class="container">
      <div class="gold-rule"></div>
      <h1 class="section-title" style="text-align:left;">Meu Carrinho</h1>

      <div id="cartWithItems" class="detail-grid hidden">
        <div class="detail-main">
          <table class="cart-table">
            <thead>
              <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Subtotal</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cartTableBody"></tbody>
          </table>
          <a href="produtos.html" class="btn-outline">&larr; Continuar Comprando</a>
        </div>

        <aside>
          <div class="cart-summary">
            <h4>Resumo do Pedido</h4>
            <div class="cart-summary-row"><span>Subtotal</span><span id="cartSubtotal">R$ 0,00</span></div>
            <div class="cart-summary-row"><span>Frete</span><span>Calculado no checkout</span></div>
            <div class="cart-summary-row total"><span>Total</span><span id="cartTotal">R$ 0,00</span></div>
            <a href="checkout.html" class="btn-gold" style="display:block;text-align:center;text-decoration:none;">Fechar Pedido &rarr;</a>
          </div>
        </aside>
      </div>

      <div id="cartEmpty" class="cart-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <p style="margin-bottom:22px;">Seu carrinho está vazio.</p>
        <a href="produtos.html" class="btn-gold" style="text-decoration:none;">Ver Produtos</a>
      </div>
    </div>
  </section>

<div id="site-footer"></div>

<script src="assets/components.js"></script>
<script src="assets/site.js"></script>
<script type="module" src="assets/chatbot.js"></script><script type="module">
  import { getCart, removeFromCart, updateQuantidade, getCartTotal } from './assets/cart.js';
  import { formatBRL } from './assets/supabase-client.js';

  const cartWithItems = document.getElementById('cartWithItems');
  const cartEmpty = document.getElementById('cartEmpty');
  const cartTableBody = document.getElementById('cartTableBody');
  const cartSubtotal = document.getElementById('cartSubtotal');
  const cartTotal = document.getElementById('cartTotal');

  function renderCart() {
    const cart = getCart();
    if (cart.length === 0) {
      cartWithItems.classList.add('hidden');
      cartEmpty.style.display = 'block';
      return;
    }
    cartWithItems.classList.remove('hidden');
    cartEmpty.style.display = 'none';

    cartTableBody.innerHTML = cart.map(item => {
      const variantes = [item.tamanho ? `Tam: ${item.tamanho}` : '', item.cor ? `Cor: ${item.cor}` : '', item.personalizacao ? `Personalização: ${item.personalizacao}` : '']
        .filter(Boolean).join(' · ');
      const mediaHTML = item.foto
        ? `<img src="${item.foto}" alt="${item.titulo}" loading="lazy">`
        : `<div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg></div>`;
      return `
        <tr data-key="${item.itemKey}">
          <td>
            <div class="cart-item-info">
              ${mediaHTML}
              <div>
                <div class="cart-item-title">${item.titulo}</div>
                <div class="cart-item-variant">${item.codigo}${variantes ? ' · ' + variantes : ''}</div>
              </div>
            </div>
          </td>
          <td>${formatBRL(item.preco)}</td>
          <td>
            <div class="qty-stepper">
              <button type="button" class="qty-minus" data-key="${item.itemKey}">-</button>
              <input type="text" value="${item.quantidade}" data-key="${item.itemKey}" class="qty-input" readonly>
              <button type="button" class="qty-plus" data-key="${item.itemKey}">+</button>
            </div>
          </td>
          <td>${formatBRL(item.preco * item.quantidade)}</td>
          <td><button type="button" class="cart-remove-btn" data-key="${item.itemKey}">Remover</button></td>
        </tr>
      `;
    }).join('');

    const total = getCartTotal();
    cartSubtotal.textContent = formatBRL(total);
    cartTotal.textContent = formatBRL(total);

    cartTableBody.querySelectorAll('.qty-plus').forEach(btn => btn.addEventListener('click', () => {
      const item = cart.find(i => i.itemKey === btn.dataset.key);
      updateQuantidade(btn.dataset.key, (item?.quantidade || 1) + 1);
      renderCart();
    }));
    cartTableBody.querySelectorAll('.qty-minus').forEach(btn => btn.addEventListener('click', () => {
      const item = cart.find(i => i.itemKey === btn.dataset.key);
      const nova = (item?.quantidade || 1) - 1;
      if (nova <= 0) { removeFromCart(btn.dataset.key); } else { updateQuantidade(btn.dataset.key, nova); }
      renderCart();
    }));
    cartTableBody.querySelectorAll('.cart-remove-btn').forEach(btn => btn.addEventListener('click', () => {
      removeFromCart(btn.dataset.key);
      renderCart();
    }));
  }

  renderCart();
  window.addEventListener('qrv-cart-updated', renderCart);
</script>
</body>
</html>
