<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="description" content="Seja um revendedor autorizado da QRV Artigos Táticos e tenha condições especiais para sua loja física, e-commerce ou revenda informal.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/favicon-192.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seja um Revendedor | QRV Artigos Táticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=25">
</head>
<body>

<div id="site-header"></div>

  <section class="page-header"><div class="container"></div></section>

  <section class="section tight">
    <div class="container" style="max-width:760px;">
      <div class="gold-rule"></div>
      <h1 class="section-title" style="text-align:left;">Seja um Revendedor QRV</h1>
      <p style="color:var(--text-muted);max-width:65ch;margin-bottom:36px;">
        Tem uma loja física, e-commerce ou banca de equipamentos táticos? Preencha o formulário abaixo e nossa equipe entra em contato com as condições especiais de revenda.
      </p>

      <div class="search-panel">
        <form id="formRevenda">
          <div class="form-row form-group">
            <div class="field"><label>Nome</label><input type="text" name="nome" required></div>
            <div class="field"><label>Telefone / WhatsApp</label><input type="tel" name="telefone" required></div>
          </div>
          <div class="form-row form-group">
            <div class="field"><label>Cidade</label><input type="text" name="cidade"></div>
            <div class="field"><label>Tipo de Negócio</label>
              <select name="tipo_negocio">
                <option>Loja física</option>
                <option>E-commerce</option>
                <option>Revenda informal / Instagram</option>
                <option>Outro</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <div class="field"><label>Observações</label><textarea name="observacoes" placeholder="Conte um pouco sobre seu negócio e volume de compra esperado"></textarea></div>
          </div>
          <div class="form-group consent-row">
            <label class="consent-check">
              <input type="checkbox" name="consentimento" required>
              <span>Concordo com os <a href="termos-de-uso.html" target="_blank">Termos de Uso</a> e autorizo o tratamento dos meus dados pessoais conforme a <a href="politica-de-privacidade.html" target="_blank">Política de Privacidade</a>.</span>
            </label>
          </div>
          <button type="submit" class="btn-gold" style="width:100%;">Enviar Solicitação</button>
        </form>
      </div>
    </div>
  </section>

<div id="site-footer"></div>

<script src="assets/components.js"></script>
<script src="assets/site.js"></script>
<script type="module" src="assets/chatbot.js"></script><script type="module" src="assets/cart.js"></script>
<script type="module">
  import { submitSolicitacaoRevenda } from './assets/supabase-client.js';

  document.getElementById('formRevenda').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    try {
      await submitSolicitacaoRevenda({
        nome: form.nome.value,
        telefone: form.telefone.value,
        cidade: form.cidade.value,
        tipo_negocio: form.tipo_negocio.value,
        observacoes: form.observacoes.value,
      });
      btn.textContent = 'Solicitação enviada ✓';
      form.reset();
    } catch (err) {
      alert('Erro ao enviar: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Enviar Solicitação';
    }
  });
</script>
</body>
</html>
